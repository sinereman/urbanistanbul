baseURL = "https://urbanistanbul.com/"
languageCode = "tr-TR"
defaultContentLanguage = "tr"
title = "URBANİSTANBUL"
enableRobotsTXT = true
enableEmoji = true
canonifyURLs = true
relativeURLs = false
# Etiket ve kategori arşiv sayfaları içeriği zayıf kopya listeler ürettiği için kapalı.
disableKinds = ["taxonomy", "term"]

[params]
  description = "İstanbul'un kültür, fotoğraf ve teknoloji rehberi. Fotoğraf atölyeleri, şehir rotaları, Urban Kare yürüyüşleri, etkinlikler ve sinema."
  gold = "#C8A96E"
  author = "Batıkan Kurşat"
  authorPage = "/hakkinda/"
  ogImage = "/images/logo.png"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

[sitemap]
  changeFreq = "weekly"
